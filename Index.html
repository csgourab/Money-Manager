<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6fa;--p:#fff;--ink:#182230;--mu:#718096;--ln:#e6eaf0;--nav:#111b2c;--ac:#4776e6;--gr:#15966a;--rd:#d84b58;--am:#c88620;--sh:0 8px 28px rgba(22,34,51,.06)}
[data-theme=dark]{--bg:#0e1522;--p:#17212f;--ink:#e6ecf5;--mu:#93a1b5;--ln:#26334a;--nav:#0a101b;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font-weight:650}button.sc{background:#e9effc;color:#2d4f9c}[data-theme=dark] button.sc{background:#22314a;color:#cfe0ff}button.gh{background:transparent;color:var(--mu);border:1px solid var(--ln)}button.dg{background:#fff0f1;color:var(--rd)}button.sm{padding:5px 9px;font-size:12px}
input,select,textarea{border:1px solid var(--ln);border-radius:9px;padding:9px 10px;background:var(--p);color:var(--ink);width:100%}label{display:grid;gap:5px;font-size:12px;color:var(--mu);font-weight:650}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{background:var(--nav);color:#dbe4f2;padding:20px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:0 8px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#5b8cff,#36c7a0);display:grid;place-items:center;font-weight:800;color:#fff}.brand b{color:#fff}.nav{display:grid;gap:3px}.nav button{background:transparent;color:#aebbd0;text-align:left;padding:10px 12px;font-weight:550}.nav button.on,.nav button:hover{background:#22314a;color:#fff}
main{padding:26px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.top h1{margin:0;font-size:25px}.top p{margin:3px 0 0;color:var(--mu)}.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.g{display:grid;gap:14px;margin-bottom:14px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.t2{grid-template-columns:1.2fr .8fr}.e2{grid-template-columns:1fr 1fr}
.card{background:var(--p);border:1px solid var(--ln);border-radius:15px;padding:16px;box-shadow:var(--sh);min-width:0}.kl{color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase}.kv{font-size:23px;font-weight:760;margin-top:6px}.kf{font-size:11px;color:var(--mu)}
.green{color:var(--gr)}.red{color:var(--rd)}.amber{color:var(--am)}.mu{color:var(--mu)}.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.sh h2{margin:0;font-size:16px}
.tw{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--ln);font-size:12px}th{color:var(--mu);font-size:11px}.nw{white-space:nowrap}
.pill{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:650;background:#eef2fb;color:#4562a4}.pill.Income{background:#e7f7f0;color:#16835f}.pill.Expense{background:#fff0f1;color:#c33f4d}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl>*{width:auto;min-width:120px;flex:1;max-width:200px}
.br{display:grid;grid-template-columns:120px 1fr 90px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar{height:9px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}.lg span{cursor:pointer}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.ch{width:100%;height:auto}.empty{text-align:center;color:var(--mu);padding:22px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:13px}.alert.r{background:#fff0f1;color:#b3303d}.alert.a{background:#fff6e5;color:#9a6512}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal b{font-size:11px;color:var(--mu);text-align:center}.cd{border:1px solid var(--ln);border-radius:9px;min-height:62px;padding:5px;cursor:pointer;font-size:11px}.cd.hi{background:#fff0f1;border-color:#f0b4ba}[data-theme=dark] .cd.hi{background:#3a1d24}.cd.sel{outline:2px solid var(--ac)}.cd.td b{color:var(--ac)}
.modal{position:fixed;inset:0;background:#10182799;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.mb{background:var(--p);border-radius:16px;padding:20px;width:min(640px,100%);max-height:92vh;overflow:auto}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h2{margin:0;font-size:18px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}.wide{grid-column:1/-1}.fg .acts{margin-top:6px}
.toast{position:fixed;bottom:20px;right:20px;background:#152238;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:9}.toast.er{background:#b3303d}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.k4,.k3{grid-template-columns:1fr 1fr}.t2,.e2{grid-template-columns:1fr}main{padding:14px}}
@media(max-width:520px){.k4,.k3,.fg{grid-template-columns:1fr}.br{grid-template-columns:90px 1fr 76px}}
@media print{.side,.acts,.fl,button{display:none!important}.app{display:block}.card{box-shadow:none}}

/* Cloud login */
#authGate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}
#authCard{width:min(420px,100%);background:var(--p);border:1px solid var(--ln);border-radius:18px;padding:26px;box-shadow:var(--sh)}
#authCard h2{margin:0 0 6px}#authCard p{color:var(--mu)}#authCard label{margin:12px 0}#authMsg{min-height:20px;color:var(--rd);font-size:12px}
#cloudBar{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:-8px 0 14px;color:var(--mu);font-size:12px}
</style></head><body>
<div id="authGate"><div id="authCard"><div class="brand" style="padding:0;margin-bottom:18px"><div class="logo">₹</div><div><b>Money Manager</b><br><small class="mu">PRIVATE CLOUD ACCESS</small></div></div><h2>Sign in</h2><p>Sign in with the email and password you created in Supabase.</p><form id="authForm"><label>Email<input id="authEmail" type="email" autocomplete="username" required></label><label>Password<input id="authPassword" type="password" autocomplete="current-password" required></label><button id="authSubmit" type="submit" style="width:100%">Sign in securely</button></form><p id="authMsg"></p><button class="gh" style="background:transparent;color:var(--ac);padding:4px 0" onclick="resetPassword()">Forgot password?</button></div></div>

<div class="app" id="appShell" style="display:none"><aside class="side"><div class="brand"><div class="logo">₹</div><div><b>Money Manager</b><br><small style="color:#91a0b8">PERSONAL FINANCE</small></div></div><nav class="nav" id="nav"></nav></aside>
<main><div class="top"><div><h1 id="pt"></h1><p id="ps"></p></div><div class="acts"><button class="sc" onclick="toggleTheme()">◐ Theme</button><button onclick="openTx()">＋ Add transaction</button></div></div><div id="cloudBar"><span id="cloudStatus">Cloud: connecting…</span><span id="signedInAs"></span><button class="sm gh" onclick="signOutNow()">Sign out</button></div><div id="view"></div></main></div>
<div class="modal" id="m"><div class="mb"><div class="mh"><h2 id="mt"></h2><button class="sm gh" onclick="cm()">✕</button></div><form id="mf" class="fg"></form></div></div><div class="toast" id="toast"></div>
<script>
const $=i=>document.getElementById(i),KEY='myMoneyManager.v1',KEY2='myMoneyManager.v2';
const p2=n=>String(n).padStart(2,'0'),ld=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>ld(new Date());
const r2=x=>Math.round((+x||0)*100)/100,sum=(a,f)=>r2(a.reduce((s,x)=>s+(f(x)||0),0));
const fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(+n||0);
const dmy=s=>s?s.split('-').reverse().join('-'):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],ml=ym=>MN[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const shift=(ym,n)=>ld(new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1)).slice(0,7);
const METH=['UPI','Cash','Debit Card','Credit Card','Bank Transfer','Wallet','Cheque','Other'],GROUPS=['Personal','Family','Baby','Household','Travel','Work','Other'],ATYPES=['Cash','Savings Account','Salary Account','Bank','UPI','Wallet','Credit Card','Other'];
const DC=[['Food & Groceries','🛒','#16a34a','Groceries,Vegetables,Dining out'],['Transportation','🚌','#0ea5e9','Fuel,Cab / Auto,Public transport'],['Shopping','🛍️','#d946ef','Clothing,Electronics'],['Household','🏠','#f59e0b','Supplies,Repairs'],['Electricity & Bills','💡','#eab308','Electricity,Water,Gas'],['Mobile & Internet','📱','#6366f1','Recharge,Broadband'],['Medical','💊','#ef4444','Doctor,Medicines'],['Baby & Childcare','🍼','#ec4899','Diapers,Baby food,School fees'],['Family','👪','#14b8a6',''],['Entertainment','🎬','#8b5cf6',''],['Travel','✈️','#06b6d4',''],['Education','📚','#3b82f6',''],['Rent','🔑','#78716c',''],['EMI & Loan','🏦','#dc2626',''],['Personal','🙂','#64748b',''],['Miscellaneous','📦','#94a3b8','']];
const DI=[['Salary','💼','#16a34a'],['Bonus','🎁','#22c55e'],['Incentives','🏆','#84cc16'],['Freelance','💻','#0d9488'],['Other Income','➕','#65a30d']];
const mk=(name,type,icon,color,subs)=>({id:uid(),name,type,icon,color,budget:0,subs:subs?subs.split(',').filter(Boolean):[],group:''});
let D,db=null,S={pg:'dashboard',ym:today().slice(0,7),cy:today().slice(0,7),sel:today(),bm:today().slice(0,7),f:{from:'',to:'',type:'',cat:'',grp:'',met:'',acc:'',q:'',sort:'d-'},rf:today().slice(0,8)+'01',rt:today()};
/* ---------- storage: IndexedDB (+ localStorage mirror) ---------- */
const idb=()=>new Promise((s,j)=>{let r=indexedDB.open('MoneyManager',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
const idbGet=k=>new Promise((s,j)=>{let q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>s(q.result);q.onerror=()=>j(q.error)});
const idbSet=(k,v)=>new Promise((s,j)=>{let t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=s;t.onerror=()=>j(t.error)});
async function save(){
 if(!currentUser||!cloudReady)return;
 $('cloudStatus').textContent='Cloud: saving…';
 const {error}=await sb.from('user_finance_data').upsert({user_id:currentUser.id,data:D,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error){$('cloudStatus').textContent='Cloud: save failed';toast('Cloud save failed: '+error.message,1);return}
 $('cloudStatus').textContent='Cloud: synced ✓';
}
function norm(o){o=o||{};let atype=a=>/card/i.test(a.name+a.id)?'Credit Card':/cash/i.test(a.name)?'Cash':/upi|wallet/i.test(a.name)?'UPI':'Bank';
 let d={accounts:(o.accounts||[]).map(a=>({type:atype(a),...a,opening:+a.opening||0})),transactions:o.transactions||[],loans:(o.loans||[]).map(l=>({...l,payments:l.payments||(l.repaid>0?[{id:uid(),date:l.date,amount:+l.repaid,note:'Earlier repayments'}]:[])})),categories:o.categories,bo:o.bo||{},cards:o.cards&&o.cards.length?o.cards:[{id:'amazon-icici',name:'Amazon ICICI',opening:0},{id:'icici',name:'ICICI',opening:0},{id:'onecard',name:'OneCard',opening:0}],cardPayments:o.cardPayments||[],settings:{budget:0,theme:'light',hi:0,lastBackup:'',...o.settings}};
 if(!d.accounts.length)d.accounts=[['cash','Cash','Cash'],['bank','Primary Bank','Bank'],['upi','UPI Wallet','UPI'],['card','Credit Card','Credit Card']].map(([id,name,type])=>({id,name,type,opening:0}));
 if(!d.categories)d.categories=[...DC.map(c=>mk(c[0],'Expense',c[1],c[2],c[3])),...DI.map(c=>mk(c[0],'Income',c[1],c[2]))];
 d.transactions.forEach(t=>{if(t.type!=='Transfer'&&t.category&&!d.categories.some(c=>c.name===t.category&&c.type===t.type))d.categories.push(mk(t.category,t.type,'🏷️','#64748b'))});return d}
/* ---------- calculations ---------- */
const T=f=>D.transactions.filter(f),tot=(ty,a,b)=>sum(T(t=>t.type===ty&&t.date>=a&&t.date<=b),t=>t.amount);
const isCard=a=>a.type==='Credit Card',nameOf=i=>D.accounts.find(a=>a.id===i)?.name||'—';
const bal=a=>r2(+a.opening+sum(D.transactions,t=>t.accountId===a.id?(t.type==='Income'?t.amount:-t.amount):(t.type==='Transfer'&&t.toAccountId===a.id?t.amount:0))-sum(D.cardPayments||[],p=>p.accountId===a.id?p.amount:0));
const cardName=i=>(D.cards.find(c=>c.id===i)||{}).name||'Card',cardOut=c=>r2(+c.opening+sum(T(t=>t.card===c.id&&t.type==='Expense'),t=>t.amount)-sum(D.cardPayments,p=>p.cardId===c.id?p.amount:0)),ccTot=()=>sum(D.cards,cardOut);
const paid=l=>sum(l.payments,p=>p.amount),out=l=>Math.max(0,r2(l.principal-paid(l)));
const catsOf=ty=>D.categories.filter(c=>c.type===ty),catOf=(n,ty)=>D.categories.find(c=>c.name===n&&c.type===ty)||{icon:'🏷️',color:'#64748b',name:n};
const weekStart=(s=today())=>{let d=new Date(s+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return ld(d)};
const by=(arr,k)=>{let m={};arr.forEach(t=>{let x=k(t)||'—';m[x]=r2((m[x]||0)+t.amount)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const effB=(c,ym)=>{let o=D.bo[ym]||{};return +(o[c.name]??c.budget)||0};
/* ---------- ui helpers ---------- */
function toast(s,er){let t=$('toast');t.textContent=s;t.className='toast'+(er?' er':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
const cm=()=>$('m').classList.remove('open'),commit=m=>{save();render();toast(m)};
function form(title,fields,v,onSave,hook){$('mt').textContent=title;let f=$('mf');
 f.innerHTML=fields.map(([k,l,t,o,w])=>`<label class="${w?'wide':''}" data-k="${k}">${l}${t==='select'?`<select name="${k}">${(o||[]).map(x=>{let[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}">${esc(b)}</option>`}).join('')}</select>`:t==='textarea'?`<textarea name="${k}" rows="2"></textarea>`:`<input name="${k}" type="${t}" ${t==='number'?'step="0.01"':''}>`}</label>`).join('')+'<div class="wide acts"><button type="button" class="gh" onclick="cm()">Cancel</button><button>Save</button></div>';
 const asg=()=>{for(let[k,x]of Object.entries(v||{}))if(f.elements[k])f.elements[k].value=x??''};
 asg();if(hook){hook(f);asg();hook(f);asg()}
 f.onsubmit=e=>{e.preventDefault();let o={};for(let el of f.elements)if(el.name)o[el.name]=el.value;let er=onSave(o);if(er)toast(er,1);else cm()};
 f.oninput=f.onchange=e=>hook&&hook(f,e);$('m').classList.add('open')}
function info(title,html){$('mt').textContent=title;$('mf').innerHTML='<div class="wide">'+html+'</div>';$('mf').onsubmit=e=>e.preventDefault();$('mf').oninput=null;$('m').classList.add('open')}
const accs=()=>D.accounts.map(a=>[a.id,a.name]),validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d>='2000-01-01'&&d<='2100-12-31'&&!isNaN(new Date(d));
const kpi=(l,v,c,f)=>`<div class="card"><div class="kl">${l}</div><div class="kv ${c||''}">${v}</div><div class="kf">${f||''}</div></div>`;
function dl(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
const csvc=x=>'"'+String(x??'').replace(/"/g,'""')+'"',csv=rows=>'\ufeff'+rows.map(r=>r.map(csvc).join(',')).join('\r\n');
const txRows=ts=>[['Date','Type','Category','Subcategory','Merchant','Description','Amount INR','Account','To Account','Payment Method','For','Notes'],...ts.map(t=>[dmy(t.date),t.type,t.category,t.sub,t.party,t.description,t.amount,nameOf(t.accountId),t.toAccountId?nameOf(t.toAccountId):'',t.method,t.group,t.notes])];
function exportTx(ts,fmtx,name){let rows=txRows(ts);if(fmtx==='csv')dl(name+'.csv',csv(rows),'text/csv');else dl(name+'.xls','<html><meta charset="UTF-8"><table border="1">'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></html>','application/vnd.ms-excel')}
/* ---------- charts ---------- */
function donut(it){let t=sum(it,i=>i.v)||1,c=2*Math.PI*40,o=0;return `<svg viewBox="0 0 100 100" width="170" height="170">${it.map(i=>{let l=i.v/t*c,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${i.c}" stroke-width="16" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"><title>${esc(i.n)}: ${fmt(i.v)}</title></circle>`;o+=l;return s}).join('')}</svg>`}
function bars(ms){let mx=Math.max(1,...ms.flatMap(m=>[m.i,m.e])),w=64,h=150;return `<svg class="ch" viewBox="0 0 ${ms.length*w} ${h+20}">${ms.map((m,k)=>`<rect x="${k*w+8}" y="${h-m.i/mx*h}" width="21" height="${m.i/mx*h}" fill="var(--gr)" rx="3"><title>${m.l} income ${fmt(m.i)}</title></rect><rect x="${k*w+33}" y="${h-m.e/mx*h}" width="21" height="${m.e/mx*h}" fill="var(--rd)" rx="3"><title>${m.l} expense ${fmt(m.e)}</title></rect><text x="${k*w+32}" y="${h+14}" text-anchor="middle" font-size="10" fill="var(--mu)">${m.l}</text>`).join('')}</svg><div class="lg"><span><i class="dot" style="background:var(--gr)"></i>Income</span><span><i class="dot" style="background:var(--rd)"></i>Expenses</span></div>`}
const hbars=(rows,tot,col)=>rows.length?rows.map(([n,v])=>`<div class="br"><span>${esc(n)}</span><div class="bar"><i style="width:${tot?100*v/tot:0}%;background:${col||'var(--ac)'}"></i></div><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">No data for this period.</div>';
/* ---------- transactions ---------- */
const txRow=t=>{let c=catOf(t.category,t.type),tr=t.type==='Transfer';return `<tr><td class="nw">${dmy(t.date)}</td><td><span class="pill ${t.type}">${t.type}</span></td><td>${tr?'⇄ Transfer':c.icon+' '+esc(t.category)+(t.sub?' › '+esc(t.sub):'')}</td><td>${esc(t.party||'')} <span class="mu">${esc(t.description||'')}</span></td><td>${esc(t.group||'')}</td><td>${t.card?'💳 '+esc(cardName(t.card)):esc(nameOf(t.accountId))}${tr?' → '+esc(nameOf(t.toAccountId)):''}<br><small class="mu">${esc(t.method||'')}</small></td><td class="nw ${t.type==='Income'?'green':t.type==='Expense'?'red':''}"><b>${t.type==='Income'?'+':t.type==='Expense'?'−':''}${fmt(t.amount)}</b></td><td class="nw"><button class="sm gh" onclick="openTx(D.transactions.find(x=>x.id=='${t.id}'))">Edit</button> <button class="sm dg" onclick="delTx('${t.id}')">✕</button></td></tr>`};
const txTable=ts=>`<div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Details</th><th>For</th><th>Account</th><th>Amount</th><th></th></tr></thead><tbody>${ts.length?ts.map(txRow).join(''):'<tr><td colspan="8" class="empty">No transactions found.</td></tr>'}</tbody></table></div>`;
function fTx(){let f=S.f,q=f.q.toLowerCase(),ts=T(t=>(!S.fixType||t.type===S.fixType)&&(!f.type||t.type===f.type)&&(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&(!f.cat||t.category===f.cat)&&(!f.grp||t.group===f.grp)&&(!f.met||t.method===f.met)&&(!f.src||(f.src==='card'?!!t.card:!t.card))&&(!f.acc||t.accountId===f.acc||t.toAccountId===f.acc)&&(!q||[t.description,t.category,t.sub,t.party,t.notes].join(' ').toLowerCase().includes(q)));
 let s=f.sort;return ts.sort((a,b)=>s==='a-'?b.amount-a.amount:s==='a+'?a.amount-b.amount:s==='d+'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
